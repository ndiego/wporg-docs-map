name: Correction or missing surface
description: A row is wrong, out of date, or a documentation surface is missing from the map.
labels: [correction]
body:
  - type: input
    id: row
    attributes:
      label: Row
      description: The row's name or id from the map (leave blank if it is missing).
  - type: dropdown
    id: kind
    attributes:
      label: What kind of change
      options:
        - A field is wrong
        - A field is out of date
        - A surface is missing
        - A surface no longer exists
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should it say
      description: The corrected value, or for a missing surface its URL, where it is edited, its source of truth and who owns it.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: A URL, a screenshot, a REST query, or how you know. Every row carries its evidence, so the fix will too.
    validations:
      required: true
